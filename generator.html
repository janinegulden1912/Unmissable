<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNÜBERHÖRBAR — Strategie Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root { --gold: #C9A84C; --gold-light: #E8D07A; --gold-glow: rgba(201,168,76,0.3); --dark: #05040a; --dark2: #0b0a14; --white: #F8F5EE; --mid: rgba(248,245,238,0.6); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--dark); color:var(--white); font-family:'Jost',sans-serif; min-height:100vh; padding:40px 20px; }
.container { max-width:900px; margin:0 auto; }
.header { text-align:center; margin-bottom:60px; }
.header h1 { font-family:'Cinzel',serif; font-size:32px; letter-spacing:4px; text-transform:uppercase; color:var(--gold-light); }
.main-grid { display:grid; grid-template-columns: 1fr 1fr; gap:30px; }
@media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }
.step-card { background:var(--dark2); border:1px solid rgba(201,168,76,0.15); padding:35px; border-radius:2px; }
.step-title { font-family:'Cinzel',serif; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:25px; display:flex; align-items:center; gap:12px; }
.step-title span { width:20px; height:20px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:10px; }
label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:2px; color:rgba(248,245,238,0.4); margin-bottom:8px; margin-top:18px; }
input, select, textarea { width:100%; padding:14px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.08); color:var(--white); font-family:'Jost',sans-serif; font-size:14px; outline:none; }
input:focus, select:focus, textarea:focus { border-color:var(--gold); }
.btn-generate { width:100%; padding:20px; background:linear-gradient(135deg, var(--gold-light), var(--gold)); color:var(--dark); border:none; font-family:'Cinzel',serif; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:4px; cursor:pointer; margin-top:30px; clip-path:polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%); }
#results { margin-top:60px; display:none; }
.variant-card { background:var(--dark2); border:1px solid var(--gold); padding:40px; margin-bottom:30px; position:relative; }
.variant-tag { position:absolute; top:-12px; left:30px; background:var(--gold); color:var(--dark); padding:4px 15px; font-size:9px; font-weight:bold; text-transform:uppercase; }
.res-title { font-family:'Cinzel',serif; font-size:22px; color:var(--gold-light); margin-bottom:20px; }
.res-content { white-space:pre-wrap; line-height:1.8; color:rgba(248,245,238,0.8); margin-bottom:30px; font-size:15px; }
.res-tip { background:rgba(201,168,76,0.05); border-left:3px solid var(--gold); padding:25px; margin-bottom:30px; font-style:italic; }
.res-prompt-box { background:rgba(0,0,0,0.3); padding:20px; border-radius:2px; margin-top:15px; }
.res-prompt-label { font-size:10px; text-transform:uppercase; color:var(--gold); letter-spacing:2px; margin-bottom:8px; display:block; }
.loading { text-align:center; display:none; padding:60px; }
.spinner { width:50px; height:50px; border:2px solid rgba(201,168,76,0.1); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 25px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <header class="header"><h1>Strategie Generator</h1></header>
  <div class="main-grid">
    <div class="step-card">
      <div class="step-title"><span>1</span> Basis Daten</div>
      <label>Künstlername</label><input type="text" id="artistName" placeholder="z.B. Elias Storm">
      <label>Genre</label><input type="text" id="genre" placeholder="z.B. Techno">
      <label>Plattform</label><select id="platform"><option>TikTok</option><option>Instagram</option></select>
    </div>
    <div class="step-card">
      <div class="step-title"><span>2</span> Strategie Fokus</div>
      <label>Rubrik</label><select id="category"><option>Emotionale Story</option><option>Reaction Hook</option><option>Song Story</option></select>
      <label>Tonalität</label><select id="tone"><option>Inspirierend</option><option>Verletzlich</option></select>
      <label>Eigene Story</label><textarea id="contextInfo" rows="3"></textarea>
    </div>
  </div>
  <button class="btn-generate" id="genBtn" onclick="generate()">⚡ Strategie Entfesseln</button>
  <div id="loading" class="loading"><div class="spinner"></div><p>KI webt deine Geschichte...</p></div>
  <div id="results"><div id="variantsContainer"></div></div>
</div>
<script>
async function generate() {
  const data = { artistName: document.getElementById('artistName').value, genre: document.getElementById('genre').value, platform: document.getElementById('platform').value, category: document.getElementById('category').value, tone: document.getElementById('tone').value, contextInfo: document.getElementById('contextInfo').value, isLifetime: true };
  const btn = document.getElementById('genBtn');
  const loader = document.getElementById('loading');
  const resDiv = document.getElementById('results');
  btn.disabled = true; loader.style.display = 'block'; resDiv.style.display = 'none';
  try {
    const response = await fetch('/.netlify/functions/generate', { method: 'POST', body: JSON.stringify(data) });
    const result = await response.json();
    renderResults(result);
    resDiv.style.display = 'block';
  } catch (err) { alert('Fehler: ' + err.message); }
  finally { btn.disabled = false; loader.style.display = 'none'; }
}
function renderResults(data) {
  const container = document.getElementById('variantsContainer');
  container.innerHTML = '';
  const variants = data.variants || [data];
  variants.forEach((v, index) => {
    const card = document.createElement('div');
    card.className = 'variant-card';
    card.innerHTML = `<div class="variant-tag">Variante 0${index + 1}</div><h3 class="res-title">${v.title}</h3><div class="res-content">${v.content}</div><div class="res-tip"><strong>Profitipp:</strong> ${v.strategyTip}</div><div class="res-prompt-box"><span class="res-prompt-label">Bild-Prompt</span><div class="res-prompt-text">${v.imagePrompt}</div></div>`;
    container.appendChild(card);
  });
}
</script>
</body>
</html>
